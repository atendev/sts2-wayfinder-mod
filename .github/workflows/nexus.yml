# Sends a published GitHub release's zip to Nexus Mods as a new version of an existing file.
# A stable tag (v1.2.3) goes to NEXUSMODS_FILE_ID, sets the mod's version, and updates the mod page's summary and
# description from docs/nexus-summary.txt and docs/nexus-description.bbcode.
# A beta tag (v1.2.3-beta.1) goes to NEXUSMODS_BETA_FILE_ID and leaves the mod's version and page alone.
# Run it by hand with page_only to push only the page text.
# Needs the NEXUSMODS_API_KEY secret, the NEXUSMODS_MOD_ID variable, and the channel's file ID variable.
# Without them the job logs a notice and does nothing.
name: Publish to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload, such as v0.2.0
        required: true
      page_only:
        description: Only update the mod page summary and description, without uploading a file
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nexus:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PAGE_ONLY: ${{ inputs.page_only == true }}
      GH_TOKEN: ${{ github.token }}
      HAS_KEY: ${{ secrets.NEXUSMODS_API_KEY != '' && vars.NEXUSMODS_MOD_ID != '' }}
      STABLE_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
      BETA_FILE_ID: ${{ vars.NEXUSMODS_BETA_FILE_ID }}
    steps:
      - name: Pick the channel
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            CHANNEL=beta FILE_ID=$BETA_FILE_ID FILE_VAR=NEXUSMODS_BETA_FILE_ID
          else
            CHANNEL=stable FILE_ID=$STABLE_FILE_ID FILE_VAR=NEXUSMODS_FILE_ID
          fi
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "FILE_ID=$FILE_ID" >> "$GITHUB_ENV"
          if [[ "$HAS_KEY" == "true" && -n "$FILE_ID" ]]; then
            echo "HAS_NEXUS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_NEXUS=false" >> "$GITHUB_ENV"
            echo "::notice::NEXUSMODS_API_KEY, NEXUSMODS_MOD_ID, or $FILE_VAR is not set. Skipping the Nexus upload."
          fi

      - name: Check out the description files
        if: env.HAS_NEXUS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs
          persist-credentials: false

      - name: Download the release zip and notes
        if: env.HAS_NEXUS == 'true' && env.PAGE_ONLY != 'true'
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir .
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          ls -l *.zip
          echo "ZIP=$(ls *.zip | head -n 1)" >> "$GITHUB_ENV"

      - name: Read the notes
        if: env.HAS_NEXUS == 'true' && env.PAGE_ONLY != 'true'
        id: notes
        run: |
          {
            echo 'body<<NOTES_EOF'
            cat notes.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        if: env.HAS_NEXUS == 'true' && env.PAGE_ONLY != 'true'
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ env.FILE_ID }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          filename: ${{ env.ZIP }}
          version: ${{ env.TAG }}
          display_name: ${{ env.CHANNEL == 'beta' && format('Wayfinder {0} (public-beta game branch)', env.TAG) || format('Wayfinder {0}', env.TAG) }}
          category: ${{ env.CHANNEL == 'beta' && 'optional' || 'main' }}
          changelog: ${{ steps.notes.outputs.body }}
          update_mod_version: ${{ env.CHANNEL == 'stable' }}

      - name: Update the mod page summary and description
        if: env.HAS_NEXUS == 'true' && env.CHANNEL == 'stable'
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
        run: |
          jq -n --rawfile summary docs/nexus-summary.txt --rawfile description docs/nexus-description.bbcode \
            '{summary: ($summary | rtrimstr("\n")), description: $description}' > payload.json
          curl --fail-with-body -sS -X PATCH "https://api.nexusmods.com/v3/mods/$MOD_ID" \
            -H "apikey: $NEXUSMODS_API_KEY" -H 'Content-Type: application/json' -d @payload.json
          echo "Updated the mod page summary and description."
